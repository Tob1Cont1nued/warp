[pytest]
# Standard: Unit-Tests (Flask Test Client, kein Browser, kein Server nötig)
testpaths = tests/unit
pythonpath = .
# --import-mode=importlib: tests/conftest.py und tests/unit/conftest.py haben
# denselben Modulnamen ("conftest") - im alten Standard-Importmodus kollidieren
# sie, sobald man beide Verzeichnisse in einem Lauf kombiniert (z.B. der "Alle
# Tests"-Befehl unten), mit "ImportError: cannot import name ... from conftest".
addopts   = --tb=short -q --import-mode=importlib

# E2E-Tests (Playwright) separat aufrufen:
#   pytest tests/ --ignore=tests/unit --browser chromium -v
#
# Unit-Tests mit Coverage:
#   pytest tests/unit/ --cov=app --cov-report=html --cov-report=term-missing
