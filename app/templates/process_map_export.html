<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <style>
    @page {
      size: {% if landscape %}A4 landscape{% else %}A4 portrait{% endif %};
      margin: 14mm 12mm;
      @bottom-center { content: "WARP Tool · Prozesskarte"; font-size: 8px; color: #888; }
      @bottom-right { content: "Seite " counter(page); font-size: 8px; color: #888; }
    }
    body { font-family: "DejaVu Sans", Arial, sans-serif; color: #111; margin: 0; }
    .head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
    .head h1 { font-size: 16px; margin: 0; }
    .head .meta { font-size: 10px; color: #666; }
    .map-frame {
      background: #0d1016; border-radius: 6px; padding: 8px;
      text-align: center;
    }
    .map-frame img { max-width: 100%; max-height: 240mm; }
  </style>
</head>
<body>
  <div class="head">
    <h1>{{ project.name }} &middot; Prozesskarte</h1>
    <span class="meta">Exportiert am {{ generated_at }} Uhr</span>
  </div>
  <div class="map-frame">
    <img src="{{ image_data_url }}" alt="Prozesskarte" />
  </div>
</body>
</html>
