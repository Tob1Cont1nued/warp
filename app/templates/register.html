<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WARP &middot; Registrierung</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}" />
</head>
<body class="login-page">

  <div class="login-card">
    <div class="login-brand">
      <span class="login-brand-name">WARP</span>
      <span class="login-brand-tagline">Wavestone Assessment Risk Planner</span>
    </div>

    <p style="margin:0; font-size:13px; color:var(--c-text-muted);">Neues Konto erstellen</p>

    {% if error %}
    <div class="login-error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('register') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <div class="field">
        <label for="username">Benutzername</label>
        <input type="text" id="username" name="username" autocomplete="username" required autofocus />
      </div>
      <div class="field">
        <label for="display_name">Anzeigename <span style="font-weight:400;color:var(--c-text-muted)">(optional)</span></label>
        <input type="text" id="display_name" name="display_name" placeholder="z.B. Max Mustermann" />
      </div>
      <div class="field">
        <label for="password">Passwort <span style="font-weight:400;color:var(--c-text-muted)">(min. 6 Zeichen)</span></label>
        <div class="pw-wrap">
          <input type="password" id="password" name="password" autocomplete="new-password" required />
          <button type="button" class="pw-toggle" onclick="togglePw(this)" tabindex="-1" aria-label="Passwort anzeigen">
            <svg class="pw-eye" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="pw-eye-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>
      <div class="field">
        <label for="password2">Passwort bestätigen</label>
        <div class="pw-wrap">
          <input type="password" id="password2" name="password2" autocomplete="new-password" required />
          <button type="button" class="pw-toggle" onclick="togglePw(this)" tabindex="-1" aria-label="Passwort anzeigen">
            <svg class="pw-eye" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="pw-eye-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary login-btn">Registrieren</button>
    </form>
<script>
function togglePw(btn) {
  var inp = btn.previousElementSibling;
  var show = inp.type === 'password';
  inp.type = show ? 'text' : 'password';
  btn.querySelector('.pw-eye').style.display = show ? 'none' : '';
  btn.querySelector('.pw-eye-off').style.display = show ? '' : 'none';
  btn.setAttribute('aria-label', show ? 'Passwort verbergen' : 'Passwort anzeigen');
}
</script>

    <a href="{{ url_for('login') }}" class="login-switch-link">Bereits registriert? Anmelden</a>

    <div class="login-foot">
      <span class="brand-mark"></span>
      <span class="login-foot-brand">wavestone</span>
    </div>
  </div>

</body>
</html>
