<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WARP &middot; Neues Projekt</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}" />
</head>
<body class="login-page">

  <div class="login-card">
    <div class="login-brand">
      <span class="login-brand-name">WARP</span>
      <span class="login-brand-tagline">Wavestone Assessment Risk Planner</span>
    </div>

    <p style="margin:0; font-size:13px; color:var(--c-text-muted);">
      {% if projects %}Neues Projekt anlegen{% else %}Willkommen! Legen Sie Ihr erstes Projekt an.{% endif %}
    </p>

    <form method="POST" action="{{ url_for('new_project') }}">
      <div class="field">
        <label>Projekttyp</label>
        <div style="display:flex;gap:10px;margin-top:4px">
          <label style="flex:1;cursor:pointer">
            <input type="radio" name="catalog_type" value="assessment" checked style="display:none" class="catalog-radio">
            <div class="catalog-type-card" data-for="assessment">
              <svg viewBox="0 0 16 16" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" style="flex-shrink:0">
                <rect x="2" y="2" width="12" height="12" rx="2"/>
                <path d="M5 8h6M5 5h6M5 11h3"/>
              </svg>
              <div>
                <strong>WARP Assessment</strong>
                <span>Strukturierte Reifegradanalyse</span>
              </div>
            </div>
          </label>
          <label style="flex:1;cursor:pointer">
            <input type="radio" name="catalog_type" value="workshop" style="display:none" class="catalog-radio">
            <div class="catalog-type-card" data-for="workshop">
              <svg viewBox="0 0 16 16" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" style="flex-shrink:0">
                <circle cx="8" cy="8" r="6"/>
                <path d="M8 5v3l2 2"/>
              </svg>
              <div>
                <strong>Workshop</strong>
                <span>Freie Fragenliste für Workshops</span>
              </div>
            </div>
          </label>
        </div>
      </div>
      <div class="field" style="margin-top:12px">
        <label for="name">Projektname</label>
        <input type="text" id="name" name="name" placeholder="z.B. Analyse Test-Reifegrad — Kunde XY" required autofocus />
      </div>
      <button type="submit" class="btn btn-primary login-btn">Projekt erstellen</button>
    </form>
    <style>
      .catalog-type-card {
        display:flex; align-items:flex-start; gap:10px; padding:12px;
        border:2px solid var(--c-border); border-radius:8px; transition:border-color .15s, background .15s;
        background:#fff;
      }
      .catalog-type-card strong { display:block; font-size:.88rem; color:var(--c-text); }
      .catalog-type-card span { font-size:.75rem; color:var(--c-text-muted); }
      .catalog-radio:checked + .catalog-type-card {
        border-color:var(--ws-blue); background:var(--ws-blue-soft);
      }
    </style>
    <script>
      document.querySelectorAll('.catalog-radio').forEach(r => {
        r.addEventListener('change', () => {
          document.querySelectorAll('.catalog-type-card').forEach(c => {
            c.style.borderColor=''; c.style.background='';
          });
          if (r.checked) {
            r.nextElementSibling.style.borderColor='var(--ws-blue)';
            r.nextElementSibling.style.background='var(--ws-blue-soft)';
          }
        });
        if (r.checked) {
          r.nextElementSibling.style.borderColor='var(--ws-blue)';
          r.nextElementSibling.style.background='var(--ws-blue-soft)';
        }
      });
    </script>

    {% if projects %}
    <a href="{{ url_for('questionnaire', pid=projects[0].id) }}" class="login-switch-link">Zurück zu meinen Projekten</a>
    {% endif %}

    <div class="login-foot">
      <span class="brand-mark"></span>
      <span class="login-foot-brand">wavestone</span>
    </div>
  </div>

</body>
</html>
